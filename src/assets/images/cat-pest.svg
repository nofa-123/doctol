<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="320" height="400" role="img">
  <defs>
    <linearGradient id="cat-wall" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#F6F1E9"/>
      <stop offset="1" stop-color="#EBE3D8"/>
    </linearGradient>
    <linearGradient id="cat-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCCFC0"/>
      <stop offset="1" stop-color="#C6B7A6"/>
    </linearGradient>
    <linearGradient id="cat-sofa" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#EFE6DA"/>
      <stop offset="1" stop-color="#DDD0BF"/>
    </linearGradient>
    <linearGradient id="cat-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#009FA3"/>
      <stop offset="1" stop-color="#007377"/>
    </linearGradient>
    <linearGradient id="cat-glass" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#DFF3F7"/>
      <stop offset="0.55" stop-color="#BFE4EC"/>
      <stop offset="1" stop-color="#9FD2DE"/>
    </linearGradient>
    <linearGradient id="cat-beam" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#FFF1CE" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFF1CE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="cat-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF1CE" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFF1CE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cat-shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#073B4C" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#073B4C" stop-opacity="0"/>
    </radialGradient>
    <filter id="cat-soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="cat-grime" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="matrix" result="mono"
        values="0 0 0 0 0.32  0 0 0 0 0.27  0 0 0 0 0.18  0 0 0 0.55 0"/>
      <feComposite in="mono" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  <rect width="320" height="400" fill="url(#cat-wall)"/>
  <rect y="300" width="320" height="100" fill="url(#cat-floor)"/>
  <rect y="286" width="320" height="14" fill="#FFFFFF" opacity="0.75"/>
  <rect y="286" width="320" height="3" fill="#073B4C" opacity="0.06"/>
  <ellipse cx="160" cy="300" rx="192" ry="64" fill="url(#cat-glow)" opacity="0.5"/>
  <g>
    <rect x="190" y="50" width="120" height="150" rx="14" fill="#FFFFFF" opacity="0.9"/>
    <rect x="200" y="60" width="100" height="130" rx="8" fill="url(#cat-glass)"/>
    <rect x="247" y="60" width="6" height="130" fill="#FFFFFF" opacity="0.85"/>
    <rect x="200" y="114.6" width="100" height="6" fill="#FFFFFF" opacity="0.85"/>
    <path d="M208 182 L255 70 L278 70 L222 182 Z"
      fill="#FFFFFF" opacity="0.35"/>
    <!-- distant skyline -->
    <g opacity="0.28" fill="#073B4C">
      <rect x="212" y="131.5" width="13" height="58.5" rx="3"/>
      <rect x="226" y="117.2" width="10" height="72.80000000000001" rx="3"/>
      <rect x="262" y="140.6" width="16" height="49.4" rx="3"/>
    </g>
    <path d="M200 190 L300 86 L390 372 L180 372 Z"
             fill="url(#cat-beam)" opacity="0.5"/>
  </g>
      
  <g>
    <rect x="20" y="120" width="150" height="51" rx="10" fill="#EFEAE2"/>
    <g stroke="#073B4C" stroke-width="1.5" opacity="0.12" fill="none">
      <path d="M69.5 120 v 51"/><path d="M119 120 v 51"/>
    </g>
    <rect x="20" y="213.5" width="150" height="13.6" rx="6" fill="#2E4A54"/>
    <rect x="20" y="227.1" width="150" height="62.9" rx="10" fill="#EFEAE2"/>
    <g stroke="#073B4C" stroke-width="1.5" opacity="0.12" fill="none">
      <path d="M80 227.1 v 62.9"/><path d="M128 227.1 v 62.9"/>
    </g>
    <g fill="#073B4C" opacity="0.35">
      <rect x="41" y="154" width="9" height="5" rx="2.5"/>
      <rect x="98" y="242.39999999999998" width="9" height="5" rx="2.5"/>
    </g>
    <path d="M44 213.5 v -27.2 q 0 -13.6 10.500000000000002 -13.6"
      stroke="#009FA3" stroke-width="6" fill="none" stroke-linecap="round"/>
    <rect x="128" y="188" width="21.000000000000004" height="25.5" rx="6" fill="#FFFFFF" opacity="0.8"/>
    
    
  </g>
  <g>
    <ellipse cx="215" cy="334" rx="39.6" ry="11" fill="url(#cat-shadow)"/>
    <path d="M184.2 330 l 4.4 -114.4 h 52.800000000000004 l 4.4 114.4 Z" fill="#F4F6F6"/>
    <path d="M179.8 215.6 q 35.2 -30.800000000000004 70.4 0 l -8.8 61.60000000000001 h -52.800000000000004 Z" fill="#FBFCFC"/>
    <circle cx="215" cy="189.2" r="23.1" fill="#F4F6F6"/>
    <ellipse cx="217.2" cy="191.39999999999998" rx="16.5" ry="12.100000000000001" fill="#7FD2D3" opacity="0.85"/>
    <rect x="164.4" y="224.39999999999998" width="24.200000000000003" height="48.400000000000006" rx="8.8" fill="url(#cat-teal)"/>
    <path d="M241.4 253 l 50.6 -17.6" stroke="#073B4C" stroke-width="8.8" stroke-linecap="round"/>
    <g fill="#7FD2D3" opacity="0.65">
      <circle cx="307.4" cy="237.6" r="4.4"/>
      <circle cx="320.6" cy="250.8" r="3.3000000000000003"/>
      <circle cx="316.2" cy="224.39999999999998" r="2.75"/>
      <circle cx="329.4" cy="233.2" r="3.8500000000000005"/>
    </g>
  </g></svg>
