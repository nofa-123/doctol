<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img">
  <defs>
    <linearGradient id="ba--wall" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#F6F1E9"/>
      <stop offset="1" stop-color="#EBE3D8"/>
    </linearGradient>
    <linearGradient id="ba--floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCCFC0"/>
      <stop offset="1" stop-color="#C6B7A6"/>
    </linearGradient>
    <linearGradient id="ba--sofa" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#EFE6DA"/>
      <stop offset="1" stop-color="#DDD0BF"/>
    </linearGradient>
    <linearGradient id="ba--teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#009FA3"/>
      <stop offset="1" stop-color="#007377"/>
