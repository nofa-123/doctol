      <stop offset="1" stop-color="#073B4C" stop-opacity="0"/>
    </radialGradient>
    <filter id="her-soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="her-grime" x="-10%" y="-10%" width="120%" height="120%">
