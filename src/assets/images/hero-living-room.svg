  <defs>
    <linearGradient id="h-wall" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#F6F1E9"/>
      <stop offset="1" stop-color="#EBE3D8"/>
    </linearGradient>
    <linearGradient id="h-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCCFC0"/>
      <stop offset="1" stop-color="#C6B7A6"/>
    </linearGradient>
    <linearGradient id="h-sofa" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#EFE6DA"/>
      <stop offset="1" stop-color="#DDD0BF"/>
    </linearGradient>
    <linearGradient id="h-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#009FA3"/>
      <stop offset="1" stop-color="#007377"/>
    </linearGradient>
    <linearGradient id="h-glass" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#DFF3F7"/>
      <stop offset="0.55" stop-color="#BFE4EC"/>
      <stop offset="1" stop-color="#9FD2DE"/>
    </linearGradient>
    <linearGradient id="h-beam" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#FFF1CE" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFF1CE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="h-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF1CE" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#FFF1CE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="h-shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#073B4C" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#073B4C" stop-opacity="0"/>
    </radialGradient>
    <filter id="h-soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="h-grime" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="matrix" result="mono"
        values="0 0 0 0 0.32  0 0 0 0 0.27  0 0 0 0 0.18  0 0 0 0.55 0"/>
      <feComposite in="mono" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
    
